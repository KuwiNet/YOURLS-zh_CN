name: Sync YOURLS zh_CN translations

on:
  schedule:
    - cron: '0 21 * * 0'   # 北京时间每周一 05:00
  workflow_dispatch:        # 手动触发

concurrency:
  group: sync-translations
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install gettext & Python deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gettext zip
          python -m pip install --quiet polib

      - name: Fetch official YOURLS.pot
        run: |
          curl -fsSL https://raw.githubusercontent.com/YOURLS/YOURLS.pot/main/YOURLS.pot -o YOURLS.pot
          echo "官方模板获取成功，大小: $(wc -c < YOURLS.pot) 字节"

      - name: Merge new strings into zh_CN.po
        run: |
          cp zh_CN.po zh_CN.po.old
          msgmerge --previous --lang=zh_CN --output-file=zh_CN.po zh_CN.po.old YOURLS.pot
          rm -f zh_CN.po.old

      - name: Translate new strings with DeepL
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python .github/scripts/translate_new.py

      - name: Compile zh_CN.mo
        run: |
          msgfmt --check zh_CN.po -o zh_CN.mo
          echo "zh_CN.mo 编译成功"

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "官方模板无更新，没有需要提交的变更。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git commit -m "chore: sync YOURLS zh_CN translations ($(date -u +%F))"
          git push origin HEAD
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Get official YOURLS version (tag 来源)
        id: version
        run: |
          TAG=$(gh api repos/YOURLS/YOURLS/releases/latest --jq .tag_name)
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "官方 YOURLS 版本: $TAG"

      - name: Create / update release
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          ZIP="yourls-zh_CN-${TAG}.zip"
          # 打包成解压即部署结构：user/languages/ 放到 YOURLS 根目录即可
          mkdir -p dist/user/languages
          cp zh_CN.po zh_CN.mo dist/user/languages/
          cp YOURLS.pot dist/
          (cd dist && zip -r ../"${ZIP}" .)
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新资产..."
            gh release upload "$TAG" "$ZIP" --clobber --repo "${{ github.repository }}"
          else
            echo "创建 Release $TAG ..."
            NOTES=$(printf '自动同步官方 YOURLS 英文模板并增量翻译。\n\n解压后把 user/languages/ 整个复制到 YOURLS 根目录即可启用简体中文。\n对应官方版本: https://github.com/YOURLS/YOURLS/releases/tag/%s' "$TAG")
            gh release create "$TAG" "$ZIP" \
              --title "YOURLS 简体中文翻译包 $TAG" \
              --notes "$NOTES" \
              --repo "${{ github.repository }}"
          fi
